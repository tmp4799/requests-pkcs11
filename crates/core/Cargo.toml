[package]
name = "requests-pkcs11-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "requests_pkcs11_core"
path = "src/lib.rs"

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env"] }
cryptoki = "0.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
rustls = "0.23.41"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
x509-certificate = "0.25.0"
